name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check-arm64:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android and Apple Silicon checks
        run: ./gradlew clean check apiCheck koverVerify --stacktrace

      - name: Build the runnable compatibility showcase
        run: |
          ./gradlew \
            :samples:composeApp:testDebugUnitTest \
            :samples:composeApp:iosSimulatorArm64Test \
            :samples:composeApp:assembleDebug \
            :samples:composeApp:linkDebugFrameworkIosArm64 \
            :samples:composeApp:linkDebugFrameworkIosSimulatorArm64 \
            --stacktrace

      - name: Build the iOS host app
        run: |
          xcodebuild \
            -project samples/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify staged artifact on an owned simulator
        run: python3 verification/apple-ci.py iosSimulatorArm64

      - name: Preserve publication consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbeewa-iosSimulatorArm64-publication-evidence
          path: |
            build/verification/*/*.log
            build/verification/*/*.json
            build/verification/*/maven/staged-files.sha256
            build/verification/*/consumer-build/reports/
            build/verification/*/consumer-build/test-results/
          if-no-files-found: warn

  check-x64:
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Intel simulator checks
        run: |
          ./gradlew \
            :gbeewa:iosX64Test \
            :samples:composeApp:iosX64Test \
            :samples:composeApp:linkDebugFrameworkIosX64 \
            --stacktrace

      - name: Verify staged artifact on an owned simulator
        run: python3 verification/apple-ci.py iosX64

      - name: Preserve publication consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbeewa-iosX64-publication-evidence
          path: |
            build/verification/*/*.log
            build/verification/*/*.json
            build/verification/*/maven/staged-files.sha256
            build/verification/*/consumer-build/reports/
            build/verification/*/consumer-build/test-results/
          if-no-files-found: warn
